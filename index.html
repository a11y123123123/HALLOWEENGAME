<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>할로윈 What Am I?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Layout: 설정 = 세로 3단계(문제 준비 → 게임 → 질문 방식) + 하단 고정 시작 바 / 게임 = 한 화면(상단 진행바 · 가운데 무대 · 하단 팀 점수판), 교실 TV 투사 기준 큰 글씨 */
:root{
  color-scheme:dark;
  --night:#120d22; --panel:#1c1532; --panel-2:#261d43; --line:#3a2f62;
  --paper:#f8efdc; --muted:#b2a6cd; --pumpkin:#ff8a1f; --pumpkin-ink:#2b1400;
  --moon:#ffe6a0; --slime:#a5e25c; --candy:#ff6fa8; --frost:#7fd8f0; --lav:#c4a6ff;
  --f-disp:'Creepster','Impact',fantasy;
  --f-ui:'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-en:'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --r:18px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--night);color:var(--paper);font-family:var(--f-ui);font-size:16px;line-height:1.5;
  background-image:
    radial-gradient(circle at 88% -4%, rgba(255,230,160,.16), transparent 34%),
    radial-gradient(1.4px 1.4px at 12% 18%, rgba(255,255,255,.55), transparent 60%),
    radial-gradient(1.2px 1.2px at 34% 8%, rgba(255,255,255,.45), transparent 60%),
    radial-gradient(1.6px 1.6px at 58% 22%, rgba(255,255,255,.4), transparent 60%),
    radial-gradient(1.2px 1.2px at 74% 40%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(1.4px 1.4px at 22% 52%, rgba(255,255,255,.3), transparent 60%),
    radial-gradient(1.2px 1.2px at 92% 66%, rgba(255,255,255,.3), transparent 60%);
  background-attachment:fixed;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--moon);outline-offset:2px;border-radius:10px}
img{max-width:100%}
.en{font-family:var(--f-en)}
#app{min-height:100%}

/* ---------- 설정 화면 ---------- */
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:20px 140px}
.hero{display:flex;align-items:center;gap:20px;padding-block:18px 26px;position:relative}
.hero-moon{flex:none;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 36% 34%, #fff7d6, var(--moon) 55%, #e7b85a);box-shadow:0 0 60px rgba(255,230,160,.45);display:grid;place-items:center}
.hero-moon img{width:58px;height:58px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.hero h1{margin:0;font-family:var(--f-disp);font-weight:400;font-size:clamp(40px,7vw,72px);line-height:1;letter-spacing:.02em;color:var(--pumpkin);text-shadow:0 3px 0 #7a2d00;text-wrap:balance}
.hero p{margin:6px 0 0;color:var(--muted);font-size:17px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:18px}
.step-h{display:flex;align-items:center;gap:12px;margin:0 0 16px;font-size:22px;font-weight:400}
.step-n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--pumpkin);color:var(--pumpkin-ink);display:grid;place-items:center;font-family:var(--f-en);font-weight:700;font-size:18px}
.step-h small{color:var(--muted);font-size:15px;margin-left:auto}
.seg{display:inline-flex;background:var(--night);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:9px 18px;border-radius:999px;font-size:17px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--pumpkin);color:var(--pumpkin-ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-block:16px 6px}
@media (max-width:700px){.chips{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chip{border:2px solid var(--line);background:var(--panel-2);border-radius:14px;padding:10px 16px;text-align:left;min-width:0}
.chip b{display:block;font-weight:400;font-size:19px}
.chip span{display:block;font-family:var(--f-en);font-size:13px;color:var(--muted);line-height:1.35}
.chip[aria-pressed="true"]{border-color:var(--pumpkin);background:rgba(255,138,31,.12)}
.chip[aria-pressed="true"] b::before{content:"✓ ";color:var(--pumpkin)}
.note{color:var(--muted);font-size:14px;margin:8px 0 0}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin-top:14px}
.wcard{border:2px solid var(--line);background:var(--panel-2);border-radius:14px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;transition:opacity .15s, transform .15s}
.wcard img{width:46px;height:46px}
.wcard .en{font-size:17px;font-weight:600;line-height:1.2;text-align:center;overflow-wrap:anywhere}
.wcard small{color:var(--muted);font-size:13px}
.wcard[aria-pressed="false"]{opacity:.38;filter:grayscale(.9)}
.wcard[aria-pressed="true"]{border-color:rgba(255,138,31,.55)}
.wcard:hover{transform:translateY(-2px)}
.minibtn{border:1px solid var(--line);background:transparent;border-radius:10px;padding:6px 12px;font-size:14px;color:var(--muted)}
.minibtn:hover{color:var(--paper);border-color:var(--muted)}
.minibtn.warn{color:var(--candy);border-color:var(--candy)}
.count{font-family:var(--f-en);font-variant-numeric:tabular-nums;color:var(--moon)}

/* 직접 입력 편집기 */
.editor{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.erow{display:grid;grid-template-columns:76px minmax(0,1fr) minmax(0,1fr) auto;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:12px;align-items:start}
.erow .clues{grid-column:2 / 4;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.iconbtn{grid-row:span 2;width:76px;height:76px;border-radius:14px;border:2px dashed var(--line);background:var(--night);display:grid;place-items:center;padding:6px;position:relative}
.iconbtn img{width:52px;height:52px;object-fit:contain}
.iconbtn::after{content:"바꾸기";position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);background:var(--night);padding:0 4px;border-radius:6px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label{font-size:12.5px;color:var(--muted);letter-spacing:.02em}
.field input{width:100%;background:var(--night);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:16px;min-width:0}
.field input:focus{border-color:var(--pumpkin);outline:none}
.field input.en{font-family:var(--f-en)}
.erow .del{border:0;background:transparent;color:var(--muted);font-size:20px;padding:6px 8px;border-radius:10px}
.erow .del:hover{color:var(--candy);background:rgba(255,111,168,.1)}
.addbtn{border:2px dashed var(--line);background:transparent;border-radius:14px;padding:14px;font-size:17px;color:var(--muted)}
.addbtn:hover{border-color:var(--pumpkin);color:var(--pumpkin)}
.sample-tag{display:inline-block;font-size:12px;background:rgba(196,166,255,.16);color:var(--lav);border-radius:6px;padding:1px 8px;margin-left:6px}

/* 게임/질문 방식 카드 */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.opt{border:2px solid var(--line);background:var(--panel-2);border-radius:16px;padding:16px 18px;text-align:left;display:flex;flex-direction:column;gap:6px;position:relative}
.opt[aria-pressed="true"]{border-color:var(--pumpkin);background:rgba(255,138,31,.1)}
.opt .t{display:flex;align-items:center;gap:10px;font-size:20px}
.opt .t img{width:36px;height:36px}
.opt .lv{font-size:12.5px;color:var(--moon);letter-spacing:.04em}
.opt p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.45}
.opt .ex{font-family:var(--f-en);font-size:14px;color:var(--paper);opacity:.85}
.opt .rec{position:absolute;top:10px;right:12px;font-size:12px;background:var(--slime);color:#1a2a06;border-radius:999px;padding:1px 9px}
.settings{display:flex;flex-wrap:wrap;gap:12px 22px;margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.set{display:flex;align-items:center;gap:8px;font-size:16px}
.set select{background:var(--night);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.toggle{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;padding:4px 0;font-size:16px;color:var(--paper)}
.toggle i{width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;transition:background .15s;flex:none}
.toggle i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--paper);transition:transform .15s}
.toggle[aria-pressed="true"] i{background:var(--pumpkin)}
.toggle[aria-pressed="true"] i::after{transform:translateX(18px)}

.startbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(18,13,34,.92);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px))}
.startbar-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.summary{flex:1 1 260px;color:var(--muted);font-size:15.5px;min-width:0}
.summary b{color:var(--paper);font-weight:400}
.summary .err{color:var(--candy)}
.bigbtn{border:0;background:var(--pumpkin);color:var(--pumpkin-ink);border-radius:16px;padding:14px 30px;font-size:21px;box-shadow:0 5px 0 #a24900;transition:transform .08s, box-shadow .08s}
.bigbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #a24900}
.bigbtn:disabled{background:var(--line);color:var(--muted);box-shadow:none;cursor:not-allowed}
.credit{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;color:var(--muted);font-size:13px;margin-top:22px}
.credit a{color:var(--muted)}
.credit img{height:16px;width:auto;filter:brightness(0) invert(1);opacity:.55}

/* ---------- 게임 화면 ---------- */
.play{height:100%;min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:14px;padding-inline:20px;padding-block:14px}
@supports (height:100dvh){.play{min-height:100dvh}}
.ptop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ghost-btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 14px;font-size:15px;color:var(--muted)}
.ghost-btn:hover{color:var(--paper)}
.ghost-btn.warn{color:var(--candy);border-color:var(--candy)}
.progress{flex:1 1 200px;display:flex;align-items:center;gap:12px;min-width:0}
.bar{flex:1;height:10px;background:var(--panel-2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pumpkin),var(--moon));border-radius:inherit;transition:width .4s}
.pnum{font-family:var(--f-en);font-weight:600;font-variant-numeric:tabular-nums;font-size:18px;white-space:nowrap}
.timer{font-family:var(--f-en);font-weight:700;font-variant-numeric:tabular-nums;font-size:22px;min-width:76px;text-align:center;padding:4px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.timer.low{color:var(--candy);border-color:var(--candy);animation:pulse .6s infinite alternate}
.timer.up{background:var(--candy);color:var(--night)}
@keyframes pulse{to{transform:scale(1.08)}}

.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:0}
.card{width:min(1100px,100%);background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:28px;padding:clamp(18px,3vw,36px);display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(16px,3vw,40px);align-items:center;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.card.solo{grid-template-columns:1fr;justify-items:center;text-align:center}
.eyebrow{font-family:var(--f-disp);font-size:clamp(34px,5vw,64px);line-height:1;color:var(--pumpkin);letter-spacing:.03em;margin:0 0 14px}
.eyebrow small{display:block;font-family:var(--f-ui);font-size:clamp(15px,1.6vw,20px);color:var(--muted);letter-spacing:0;margin-top:8px}
.clues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.clue{display:flex;align-items:center;gap:12px;font-family:var(--f-en);font-weight:500;font-size:clamp(22px,3.1vw,42px);line-height:1.2;padding:12px 16px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line);animation:rise .35s ease both}
.clue .k{flex:none;font-family:var(--f-en);font-weight:700;font-size:.6em;width:1.7em;height:1.7em;border-radius:50%;display:grid;place-items:center;background:var(--pumpkin);color:var(--pumpkin-ink)}
.clue .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.clue.locked{color:var(--muted);font-family:var(--f-ui);font-size:clamp(17px,2vw,24px);border-style:dashed;background:transparent;animation:none}
.clue.locked .k{background:var(--line);color:var(--muted)}
.say{flex:none;border:0;background:rgba(255,230,160,.12);color:var(--moon);width:46px;height:46px;border-radius:50%;font-size:20px;display:grid;place-items:center}
.say:hover{background:rgba(255,230,160,.25)}
@keyframes rise{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}

.pic{position:relative;display:grid;place-items:center;aspect-ratio:1;width:min(100%,420px);max-width:100%;justify-self:center;border-radius:50%;background:radial-gradient(circle at 50% 45%, rgba(255,230,160,.22), rgba(255,230,160,.04) 62%, transparent 70%)}
.pic img{width:72%;height:72%;object-fit:contain;transition:filter .6s ease, transform .6s cubic-bezier(.3,1.6,.5,1)}
.pic.shadow img{filter:brightness(0) drop-shadow(0 0 22px rgba(255,230,160,.55))}
.pic.hide img{opacity:0}
.pic .qmark{position:absolute;font-family:var(--f-disp);font-size:clamp(110px,16vw,220px);color:var(--pumpkin);opacity:.9;text-shadow:0 6px 0 #7a2d00;pointer-events:none}
.pic.pop img{transform:scale(1.08)}
.sentence{font-family:var(--f-en);font-weight:600;font-size:clamp(28px,4.2vw,60px);line-height:1.2;margin:0;text-wrap:balance}
.sentence + .sentence{margin-top:12px;color:var(--moon)}
.blank{display:inline-block;min-width:3.4em;border-bottom:5px solid var(--pumpkin);margin-inline:.12em;height:.95em;vertical-align:-.08em}
.fill{color:var(--pumpkin);font-weight:700}
.hintline{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;justify-content:inherit}
.hintpill{font-family:var(--f-en);font-size:clamp(20px,2.6vw,34px);letter-spacing:.18em;background:rgba(165,226,92,.12);color:var(--slime);border:1px solid rgba(165,226,92,.4);border-radius:14px;padding:6px 16px}
.hintpill.ko{font-family:var(--f-ui);letter-spacing:0}
.answer{margin-top:18px;animation:rise .45s ease both}
.answer .line{font-family:var(--f-en);font-weight:600;font-size:clamp(26px,3.8vw,52px);line-height:1.15;margin:0}
.answer .word{font-family:var(--f-en);font-weight:700;color:var(--pumpkin);font-size:clamp(50px,8vw,120px);line-height:1;margin:6px 0 0;overflow-wrap:anywhere}
.answer .ko{font-size:clamp(20px,2.4vw,30px);color:var(--muted);margin-top:8px}
.controls{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.cbtn{border:0;border-radius:16px;padding:14px 24px;font-size:clamp(17px,1.7vw,21px);background:var(--panel-2);color:var(--paper);border:1px solid var(--line);display:inline-flex;align-items:center;gap:8px}
.cbtn:hover{border-color:var(--muted)}
.cbtn.primary{background:var(--pumpkin);color:var(--pumpkin-ink);border-color:transparent;box-shadow:0 4px 0 #a24900}
.cbtn.slime{background:var(--slime);color:#1a2a06;border-color:transparent;box-shadow:0 4px 0 #5d8a26}
.cbtn:disabled{opacity:.4;cursor:not-allowed}
.cbtn .pts{font-family:var(--f-en);font-size:.85em;background:rgba(0,0,0,.18);border-radius:8px;padding:0 7px}
.keys{color:var(--muted);font-size:13px;text-align:center}
.keys kbd{font-family:var(--f-en);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;font-size:12px}

.scores{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.team{flex:1 1 150px;max-width:230px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 10px;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:10px 12px;--tc:var(--pumpkin)}
.team img{width:34px;height:34px;grid-row:span 2}
.team .nm{font-size:16px;line-height:1.1}
.team .sc{font-family:var(--f-en);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;color:var(--tc)}
.team .plus{grid-row:span 2;border:0;background:var(--tc);color:#1a1020;border-radius:12px;padding:10px 12px;font-family:var(--f-en);font-weight:700;font-size:18px;min-width:56px}
.team .minus{grid-column:2;justify-self:start;border:0;background:transparent;color:var(--muted);font-size:12px;padding:0}
.team.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.08);border-color:var(--tc)}}

/* 빙고 */
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;width:min(1100px,100%)}
.bank .wcard{padding:14px 8px}
.bank .wcard img{width:60px;height:60px}
.bank .wcard .en{font-size:22px}
.bingo-title{font-family:var(--f-disp);color:var(--pumpkin);font-size:clamp(46px,7vw,90px);line-height:1;margin:0;text-shadow:0 4px 0 #7a2d00;letter-spacing:.04em}
.lead{color:var(--muted);font-size:clamp(16px,1.8vw,21px);margin:6px 0 0;text-align:center;text-wrap:balance}
.gridpick{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.gridpick button{border:2px solid var(--line);background:var(--panel-2);border-radius:14px;padding:10px 18px;font-family:var(--f-en);font-size:20px;font-weight:600}
.gridpick button[aria-pressed="true"]{border-color:var(--pumpkin);background:rgba(255,138,31,.12)}
.gridpick button:disabled{opacity:.35;cursor:not-allowed}
.called{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;width:min(1100px,100%);margin-inline:auto}
.called .c{flex:none;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 6px;font-family:var(--f-en);font-size:15px}
.called .c img{width:26px;height:26px}
.called .c b{font-family:var(--f-en);color:var(--moon);font-weight:700;font-variant-numeric:tabular-nums}
.called-h{display:flex;justify-content:space-between;align-items:center;gap:10px;width:min(1100px,100%);margin:0 auto 8px;color:var(--muted);font-size:14px}

/* 결과 */
.result{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding-inline:20px;padding-block:30px;text-align:center}
.podium{display:flex;flex-direction:column;gap:10px;width:min(560px,100%)}
.prow{display:grid;grid-template-columns:52px 44px 1fr auto;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 18px;text-align:left}
.prow.first{border-color:var(--moon);background:rgba(255,230,160,.08)}
.prow .rk img{width:42px;height:42px}
.prow .rk span{font-family:var(--f-en);font-weight:700;font-size:22px;color:var(--muted);display:block;text-align:center}
.prow > img{width:40px;height:40px}
.prow .nm{font-size:20px}
.prow .sc{font-family:var(--f-en);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums}

/* 모달 */
.modal{position:fixed;inset:0;z-index:50;background:rgba(8,5,16,.7);display:grid;place-items:center;padding:20px}
.modal-in{width:min(760px,100%);max-height:min(86vh,760px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.modal-h h3{margin:0;font-size:21px;font-weight:400}
.igroup{color:var(--muted);font-size:14px;margin:16px 0 8px}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}
.igrid button{border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:8px;aspect-ratio:1;display:grid;place-items:center}
.igrid button:hover{border-color:var(--pumpkin)}
.igrid img{width:36px;height:36px}
.upload{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--night);border:1px dashed var(--line);border-radius:14px;padding:12px 14px}
.upload input{max-width:100%}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(8,5,16,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center}
.overlay .bingo-title{font-size:clamp(70px,13vw,170px)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

/* Pretendard 굵기 위계 */
body{font-weight:500;letter-spacing:-.01em}
.step-h,.opt .t,.modal-h h3,.chip b,.prow .nm{font-weight:700}
.bigbtn,.cbtn,.seg button,.team .nm,.wcard small,.hero p{font-weight:600}
.note,.opt p,.summary,.lead,.keys{font-weight:500}
.answer .word,.sentence,.clue{letter-spacing:-.02em}

@media (max-width:760px){
  .card{grid-template-columns:1fr;text-align:center}
  .card .pic{width:min(70%,300px);order:-1}
  .clue{text-align:left}
  .erow{grid-template-columns:64px minmax(0,1fr) auto}
  .erow .field.ko{grid-column:2}
  .erow .clues{grid-column:1 / -1;grid-template-columns:1fr}
  .iconbtn{grid-row:span 2;width:64px;height:64px}
  .hero-moon{width:70px;height:70px}.hero-moon img{width:44px;height:44px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

const save = () => { store.set('hw-set', S); };
let saveTimer; const saveCustom = () => { clearTimeout(saveTimer); saveTimer = setTimeout(() => store.set('hw-custom', CUSTOM), 250); };

/* ===== 유틸 ===== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ico = k => (k && k.startsWith('data:')) ? k : (ICONS[k] || ICONS.question);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const article = it => it.art || (/^[aeiou]/i.test(it.w) ? 'an' : 'a');
const plural = it => {
  if (it.pl) return it.pl;
  const w = it.w.trim(), parts = w.split(' '), last = parts.pop();
  let p;
  if (/[^aeiou]y$/i.test(last)) p = last.slice(0, -1) + 'ies';
  else if (/(s|x|z|ch|sh)$/i.test(last)) p = last + 'es';
  else if (/(wolf|leaf|knife|loaf)$/i.test(last)) p = last.replace(/fe?$/i, 'ves');
  else if (/^mouse$/i.test(last)) p = 'mice';
  else p = last + 's';
  return [...parts, p].join(' ');
};
const letterHint = w => [...w].map((ch, i) => /[a-z]/i.test(ch) ? ((i === 0 || w[i - 1] === ' ') ? ch : '_') : (ch === ' ' ? ' ' : ch)).join(' ');
const cleanClues = it => (it.c || []).map(s => (s || '').trim()).filter(Boolean);

function pool() {
  if (S.source === 'rec') return [...S.grades].sort().flatMap(g => BANK[g] || []).filter(it => !S.off.includes(it.id));
  return CUSTOM.filter(it => (it.w || '').trim()).map(it => ({ ...it, w: it.w.trim() }));
}

/* ===== 소리 (WebAudio, 외부 파일 없음) ===== */
let AC = null;
function tone(f, dur, type = 'sine', vol = .12, when = 0, to) {
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + .05);
  } catch (e) {}
}
const SFX = {
  hint() { tone(620, .14, 'triangle', .1); tone(930, .16, 'triangle', .07, .07); },
  reveal() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .22, 'triangle', .11, i * .08)); },
  award() { tone(988, .09, 'square', .05); tone(1319, .3, 'square', .05, .08); },
  oops() { tone(300, .2, 'triangle', .08, 0, 200); },
  timeup() { tone(220, .5, 'sawtooth', .07, 0, 140); },
  spooky() { tone(330, .7, 'sine', .09, 0, 520); tone(520, .9, 'sine', .07, .6, 250); },
  bingo() { [392, 523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .25, 'square', .05, i * .07)); },
};
function speak(t) {
  try {
    const s = window.speechSynthesis; if (!s || !t) return;
    s.cancel();
    const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = .82;
    const v = s.getVoices().find(v => /^en[-_]US/i.test(v.lang)); if (v) u.voice = v;
    s.speak(u);
  } catch (e) {}
}

/* ===== 화면 상태 ===== */
let screen = 'setup';
let G = null;        // 진행 중인 게임
let confirmKey = null; // 두 번 눌러 확인

function go(s) { screen = s; stopTimer(); render(); window.scrollTo(0, 0); }
function render() {
  const app = $('#app');
  if (screen === 'setup') app.innerHTML = setupHTML();
  else if (screen === 'quiz' || screen === 'bingo') app.innerHTML = playHTML();
  else if (screen === 'bprep') app.innerHTML = bprepHTML();
  else if (screen === 'result') app.innerHTML = resultHTML();
}

/* ---------- 설정 ---------- */
function setupHTML() {

    <div class="row" style="margin-top:12px">

  const customPanel = `

    <div class="editor">
      ${CUSTOM.map((it, n) => `

          <div class="field ko"><label for="k-${it.id}">뜻 (한국어)</label><input id="k-${it.id}" data-f="ko" value="${esc(it.ko)}" placeholder="유령" autocomplete="off"></div>
          <button class="del" data-act="delrow" data-idx="${n}" aria-label="이 단어 지우기">✕</button>
          <div class="clues">
            ${[0, 1, 2].map(j => `<div class="field"><label for="c${j}-${it.id}">단서 ${j + 1}</label><input id="c${j}-${it.id}" class="en" data-f="c${j}" value="${esc((it.c || [])[j] || '')}" placeholder="${['I am white.', 'I can fly.', 'I say “Boo!”'][j]}" autocomplete="off"></div>`).join('')}
          </div>
        </div>`).join('')}
      <button class="addbtn" data-act="addrow">＋ 단어 추가하기</button>
    </div>
    <div class="row" style="margin-top:12px">
      <span>입력한 단어 <span class="count">${p.length}</span>개</span>
      <button class="minibtn ${confirmKey === 'clear' ? 'warn' : ''}" data-act="clearall">${confirmKey === 'clear' ? '한 번 더 누르면 모두 지워요' : '모두 지우기'}</button>
      <button class="minibtn" data-act="resetsample">예시 단어 다시 넣기</button>

  const modeCards = Object.entries(MODES).map(([k, m]) => `

    ? `<b>단어 ${p.length}개</b> · ${S.game === 'quiz' ? 'What Am I? 퀴즈' : '할로윈 빙고'} · ${MODES[S.mode].name}${S.game === 'quiz' ? ` · ${S.teams ? S.teams + '팀' : '점수 없음'}` : ''}`
    : `<span class="err">${S.game === 'bingo' ? `빙고는 단어가 9개 이상 필요해요 (지금 ${p.length}개).` : '단어를 1개 이상 골라 주세요.'}</span>`;

  return `

          <span class="t"><img src="${ico('crystal')}" alt="">What Am I? 퀴즈</span>
          <p>모둠끼리 겨뤄요. 한 문제씩 단서를 공개하고, 먼저 맞힌 팀에 점수를 줘요.</p>

      <div class="opts">${modeCards}</div>
      <div class="settings">
        ${S.mode === 'sentence' ? `<label class="set">문장 패턴 <select id="sel-pattern" data-act="pattern">${Object.entries(PATTERNS).map(([k, v]) => `<option value="${k}" ${S.pattern === k ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select></label>` : ''}
        ${S.game === 'quiz' ? `<label class="set">팀 수 <select id="sel-teams" data-act="teams">${[0, 2, 3, 4, 5, 6].map(n => `<option value="${n}" ${S.teams === n ? 'selected' : ''}>${n ? n + '팀' : '점수 없이'}</option>`).join('')}</select></label>` : ''}
        <label class="set">문제당 타이머 <select id="sel-timer" data-act="timer">${[0, 15, 30, 60].map(n => `<option value="${n}" ${S.timer === n ? 'selected' : ''}>${n ? n + '초' : '없음'}</option>`).join('')}</select></label>

/* ---------- 게임 진행 ---------- */
function startGame() {
  const p = pool();
  const list = S.shuffle ? shuffle(p) : p.slice();
  G = { kind: S.game, list, idx: 0, hints: 0, revealed: false, scores: Array(S.teams).fill(0), log: [], called: [] };
  SFX.spooky();
  if (S.game === 'bingo') { const maxN = Math.floor(Math.sqrt(list.length)); if (S.bingoN > maxN) S.bingoN = Math.min(5, maxN); go('bprep'); }
  else { go('quiz'); onQuestion(); }
}
const cur = () => G.list[G.idx];
function effMode(it) { return (S.mode === 'clue' && cleanClues(it).length === 0) ? 'picture' : S.mode; }
function maxHints(it) { return effMode(it) === 'clue' ? Math.max(0, cleanClues(it).length - 1) : 2; }
function points() { return Math.max(1, 3 - G.hints); }

function onQuestion() {
  G.hints = 0; G.revealed = false; G.awarded = false;
  startTimer();
  const it = cur();
  if (S.autoSpeak && effMode(it) === 'clue') setTimeout(() => speak(cleanClues(it)[0]), 450);
}
function answerLine(it) {
  const m = effMode(it);
  if (m === 'clue') return `You are ${article(it)} ${it.w}!`;
  if (m === 'sentence') {
    if (S.pattern === 'have') return `Do you have any ${plural(it)}? Yes, I do!`;
    if (S.pattern === 'isit') return `Is it ${article(it)} ${it.w}? Yes, it is!`;
    return `What's this? It's ${article(it)} ${it.w}.`;
  }
  return `It's ${article(it)} ${it.w}!`;
}

function sentenceHTML(it, rev) {
  const W_ = t => rev ? `<b class="fill">${esc(t)}</b>` : '<span class="blank"></span>';
  if (S.pattern === 'have') return `<p class="sentence">Do you have any ${W_(plural(it))}?</p>${rev ? '<p class="sentence">Yes, I do! / No, I don\'t.</p>' : ''}`;
  if (S.pattern === 'isit') return `<p class="sentence">Is it ${article(it)} ${W_(it.w)}?</p>${rev ? '<p class="sentence">Yes, it is!</p>' : ''}`;
  return `<p class="sentence">What's this?</p><p class="sentence">It's ${article(it)} ${W_(it.w)}.</p>`;
}

function stageHTML() {
  const it = cur(), m = effMode(it), rev = G.revealed;
  const clues = cleanClues(it);
  const hintPills = () => {
    const h = [];
    if (G.hints >= 1) h.push(`<span class="hintpill">${esc(letterHint(it.w))}</span>`);
    if (G.hints >= 2 && it.ko) h.push(`<span class="hintpill ko">${esc(it.ko)}</span>`);
    return h.length && !rev ? `<div class="hintline">${h.join('')}</div>` : '';
  };
  const answer = rev ? `<div class="answer">
      ${m === 'clue' ? `<p class="line">You are ${article(it)}</p>` : ''}
      <p class="word">${esc(it.w)}${m === 'clue' ? '!' : ''}</p>
      ${S.showKo && it.ko ? `<div class="ko">${esc(it.ko)}</div>` : ''}
    </div>` : '';
  const picCls = rev ? 'pop' : (m === 'picture' ? 'shadow' : (m === 'clue' ? 'hide' : ''));
  const pic = `<div class="pic ${picCls}"><img src="${ico(it.i)}" alt="">${(!rev && m === 'clue') ? '<span class="qmark">?</span>' : ''}</div>`;

  let left = '';
  if (m === 'clue') {
    const shown = 1 + G.hints;
    left = `<h2 class="eyebrow">What am I?<small>단서를 듣고 나는 누구일까요?</small></h2>
      <ol class="clues">${clues.map((c, i) => i < shown || rev
        ? `<li class="clue"><span class="k">${i + 1}</span><span class="txt">${esc(c)}</span><button class="say" data-act="say" data-t="${esc(c)}" aria-label="읽어주기">🔊</button></li>`
        : `<li class="clue locked"><span class="k">${i + 1}</span><span class="txt">다음 단서</span></li>`).join('')}</ol>${answer}`;
  } else if (m === 'sentence') {
    left = `<h2 class="eyebrow" style="font-size:clamp(28px,3.6vw,44px)">Say it!<small>그림을 보고 빈칸을 채워 문장으로 말해요</small></h2>
      ${sentenceHTML(it, rev)}${hintPills()}${answer && S.showKo && it.ko ? `<div class="answer"><div class="ko">${esc(it.w)} · ${esc(it.ko)}</div></div>` : ''}`;
  } else {
    left = `<h2 class="eyebrow">Who am I?<small>그림자의 주인공을 영어로 말해요</small></h2>${hintPills()}${answer}`;
  }
  return `<div class="card">${`<div>${left}</div>`}${pic}</div>`;
}

function controlsHTML() {
  const it = cur(), m = effMode(it), rev = G.revealed;
  const canHint = !rev && G.hints < maxHints(it);
  const hintLabel = m === 'clue' ? `다음 단서 (${G.hints + 2}/${cleanClues(it).length})` : (G.hints === 0 ? '첫 글자 힌트' : '뜻 힌트');
  const isLast = G.kind === 'quiz' ? G.idx >= G.list.length - 1 : G.idx >= G.list.length - 1;
  const sayTxt = rev ? answerLine(it) : (m === 'clue' ? cleanClues(it).slice(0, 1 + G.hints).join(' ') : (m === 'sentence' ? '' : ''));
  return `<div class="controls">
    ${!rev ? `<button class="cbtn" data-act="hint" ${canHint ? '' : 'disabled'}>💡 ${hintLabel}</button>` : ''}
    ${sayTxt ? `<button class="cbtn" data-act="say" data-t="${esc(sayTxt)}">🔊 읽어주기</button>` : ''}
    ${!rev ? `<button class="cbtn primary" data-act="reveal">정답 공개 ${G.kind === 'quiz' && S.teams ? `<span class="pts">지금 ${points()}점</span>` : ''}</button>` : ''}
    ${rev ? (G.kind === 'quiz'
      ? `<button class="cbtn primary" data-act="next">${isLast ? '결과 보기 🏆' : '다음 문제 →'}</button>`
      : `<button class="cbtn primary" data-act="draw" ${isLast ? 'disabled' : ''}>${isLast ? '모든 단어를 뽑았어요' : '다음 단어 뽑기 🎃'}</button>`) : ''}
    ${G.kind === 'bingo' ? `<button class="cbtn slime" data-act="bingo">BINGO! 확인</button>` : ''}
  </div>
  <div class="keys"><kbd>Space</kbd> 다음 단계 · <kbd>R</kbd> 정답 · <kbd>S</kbd> 읽어주기${G.kind === 'quiz' && S.teams ? ' · <kbd>1</kbd>~<kbd>' + S.teams + '</kbd> 팀 점수' : ''}</div>`;
}

function scoresHTML() {
  if (G.kind !== 'quiz' || !S.teams) return '<div></div>';
  return `<div class="scores">${G.scores.map((s, n) => { const t = TEAMS[n]; return `
    <div class="team" id="team-${n}" style="--tc:${t.c}">
      <img src="${ico(t.i)}" alt=""><span class="nm">${t.nm}</span>
      <button class="plus" data-act="award" data-n="${n}" aria-label="${t.nm}에 ${points()}점">+${G.revealed ? (G.lastPts || points()) : points()}</button>
      <span class="sc">${s}</span>
      <button class="minus" data-act="minus" data-n="${n}">−1 되돌리기</button>
    </div>`; }).join('')}</div>`;
}

function playHTML() {
  const total = G.list.length, n = G.kind === 'quiz' ? G.idx + 1 : G.called.length;
  const pct = Math.round(n / total * 100);
  const isBingo = G.kind === 'bingo';
  const body = isBingo && !G.called.length
    ? `<div class="stage"><h2 class="bingo-title">BINGO</h2><p class="lead">빙고판 준비가 끝났나요? 첫 단어를 뽑아요!</p><div class="controls"><button class="cbtn primary" data-act="draw">첫 단어 뽑기 🎃</button></div></div>`
    : `<div class="stage">${stageHTML()}${controlsHTML()}</div>`;
  const calledStrip = isBingo && G.called.length ? `<div>
      <div class="called-h"><span>뽑은 단어 <span class="count">${G.called.length}</span> / ${total}</span><span>빙고판 ${S.bingoN}×${S.bingoN}</span></div>
      <div class="called">${G.called.map((it, i) => `<span class="c"><b>${i + 1}</b><img src="${ico(it.i)}" alt="">${G.called.length - 1 === i && !G.revealed ? '???' : esc(it.w)}</span>`).join('')}</div></div>` : '';
  return `<div class="play">
    <div class="ptop">
      <button class="ghost-btn ${confirmKey === 'quit' ? 'warn' : ''}" data-act="quit">${confirmKey === 'quit' ? '한 번 더 누르면 설정으로' : '← 설정'}</button>
      <div class="progress"><span class="pnum">${isBingo ? '빙고' : `${n} / ${total}`}</span><div class="bar"><i style="width:${pct}%"></i></div></div>
      ${S.timer ? `<span class="timer" id="timer">${S.timer}</span>` : ''}
      <button class="ghost-btn" data-act="mute" aria-label="효과음">${muted ? '🔇' : '🔈'}</button>
      <button class="ghost-btn" data-act="fs" aria-label="전체 화면">⛶ 전체 화면</button>
    </div>
    ${body}
    ${isBingo ? calledStrip : scoresHTML()}
  </div>`;
}

/* ---------- 빙고 준비 ---------- */
function bprepHTML() {
  const n = G.list.length, maxN = Math.floor(Math.sqrt(n));
  const words = [...G.list].sort((a, b) => a.w.localeCompare(b.w));
  return `<div class="play" style="grid-template-rows:auto 1fr">
    <div class="ptop"><button class="ghost-btn" data-act="quit2">← 설정</button><span class="pnum" style="margin-left:auto">단어 ${n}개</span></div>
    <div class="stage" style="justify-content:flex-start;gap:20px">
      <h2 class="bingo-title">BINGO</h2>
      <p class="lead">공책에 ${S.bingoN}×${S.bingoN} 칸을 그리고, 아래 단어 중 ${S.bingoN * S.bingoN}개를 골라 마음대로 적어요.<br>선생님이 뽑은 단어를 맞히면 ✔ 표시! 한 줄이 완성되면 “BINGO!”</p>
      <div class="gridpick" role="group" aria-label="빙고판 크기">
        ${[3, 4, 5].map(k => `<button data-act="bingoN" data-v="${k}" aria-pressed="${S.bingoN === k}" ${k > maxN ? 'disabled' : ''}>${k}×${k}</button>`).join('')}
      </div>
      <div class="bank">${words.map(it => `<div class="wcard"><img src="${ico(it.i)}" alt=""><span class="en">${esc(it.w)}</span>${S.showKo && it.ko ? `<small>${esc(it.ko)}</small>` : ''}</div>`).join('')}</div>
      <div class="controls"><button class="bigbtn" data-act="bstart">빙고 시작 ▶</button></div>
    </div>
  </div>`;
}

/* ---------- 결과 ---------- */
function resultHTML() {
  const ranked = G.scores.map((s, n) => ({ s, n })).sort((a, b) => b.s - a.s);
  let rank = 0, prev = null;
  const medal = ['medal1', 'medal2', 'medal3'];
  const rows = ranked.map((r, i) => { if (r.s !== prev) rank = i + 1; prev = r.s; const t = TEAMS[r.n];
    return `<div class="prow ${rank === 1 ? 'first' : ''}"><div class="rk">${rank <= 3 ? `<img src="${ico(medal[rank - 1])}" alt="${rank}등">` : `<span>${rank}</span>`}</div><img src="${ico(t.i)}" alt=""><span class="nm">${t.nm}</span><span class="sc" style="color:${t.c}">${r.s}</span></div>`; }).join('');
  return `<div class="result">
    <img src="${ico('trophy')}" alt="" style="width:110px;height:110px">
    <h2 class="bingo-title">Happy Halloween!</h2>
    ${S.teams ? `<div class="podium">${rows}</div>` : `<p class="lead">${G.list.length}개의 단어를 모두 풀었어요. 잘했어요!</p>`}
    <div class="controls"><button class="cbtn primary" data-act="again">같은 단어로 다시 하기</button><button class="cbtn" data-act="quit2">설정으로</button></div>
  </div>`;
}

/* ===== 타이머 ===== */
let tInt = null, tEnd = 0;
function startTimer() {
  stopTimer(); if (!S.timer) return;
  tEnd = Date.now() + S.timer * 1000; let fired = false;
  tInt = setInterval(() => {
    const el = $('#timer'); if (!el) return;
    if (G && G.revealed) { el.className = 'timer'; return; }
    const left = Math.max(0, Math.ceil((tEnd - Date.now()) / 1000));
    el.textContent = left ? left : '땡!';
    el.className = 'timer' + (left === 0 ? ' up' : left <= 5 ? ' low' : '');
    if (!left && !fired) { fired = true; SFX.timeup(); }
  }, 200);
}
function stopTimer() { clearInterval(tInt); tInt = null; }

/* ===== 동작 ===== */
function doHint() { const it = cur(); if (G.revealed || G.hints >= maxHints(it)) return; G.hints++; SFX.hint(); render();
  if (S.autoSpeak && effMode(it) === 'clue') speak(cleanClues(it)[G.hints]); }
function doReveal() { if (G.revealed) return; G.lastPts = points(); G.revealed = true; SFX.reveal(); render(); if (S.autoSpeak) setTimeout(() => speak(answerLine(cur())), 350); }
function doNext() {
  if (G.kind === 'quiz') { if (G.idx >= G.list.length - 1) { go('result'); rain(); return; } G.idx++; onQuestion(); render(); }
  else doDraw();
}
function doDraw() {
  if (G.called.length >= G.list.length) return;
  if (G.called.length) G.idx++;
  G.called.push(G.list[G.idx]); onQuestion(); SFX.spooky(); render();
}
function advance() { // Space 키: 힌트 → 정답 → 다음
  if (!G) return;
  if (G.kind === 'bingo' && !G.called.length) return doDraw();
  if (!G.revealed) { if (G.hints < maxHints(cur())) doHint(); else doReveal(); }
  else doNext();
}
function award(n, delta) {
  if (!G || !S.teams) return;
  const v = delta ?? (G.revealed ? (G.lastPts || points()) : points());
  G.scores[n] = Math.max(0, G.scores[n] + v);
  v > 0 ? SFX.award() : SFX.oops();
  render(); const el = $('#team-' + n); if (el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
}
function showBingo() {
  SFX.bingo(); rain();
  const ov = document.createElement('div'); ov.className = 'overlay'; ov.id = 'ov';
  ov.innerHTML = `<h2 class="bingo-title">BINGO!</h2><p class="lead">지금까지 뽑은 단어로 확인해요</p>
    <div class="called" style="flex-wrap:wrap;justify-content:center;overflow:visible">${G.called.map((it, i) => `<span class="c"><b>${i + 1}</b><img src="${ico(it.i)}" alt="">${(i === G.called.length - 1 && !G.revealed) ? '???' : esc(it.w)}</span>`).join('')}</div>
    <div class="controls"><button class="cbtn primary" data-act="closeov">계속하기</button><button class="cbtn" data-act="quit2">게임 끝내기</button></div>`;
  document.body.appendChild(ov);
}

/* ===== 아이콘 선택 모달 ===== */
let pickIdx = -1;
function openIcons(idx) {
  pickIdx = idx;
  const m = document.createElement('div'); m.className = 'modal'; m.id = 'iconmodal';
  m.innerHTML = `<div class="modal-in" role="dialog" aria-label="그림 고르기">
    <div class="modal-h"><h3>그림 고르기</h3><button class="ghost-btn" data-act="closemodal">닫기</button></div>
    <label class="upload" for="up-img">📁 내 그림 올리기 <input type="file" id="up-img" accept="image/*"><span class="note" style="margin:0">자동으로 작게 줄여 저장돼요</span></label>
    ${ICON_GROUPS.map(([g, keys]) => `<div class="igroup">${g}</div><div class="igrid">${keys.filter(k => ICONS[k]).map(k => `<button data-act="seticon" data-k="${k}" aria-label="${k}"><img src="${ICONS[k]}" alt=""></button>`).join('')}</div>`).join('')}
  </div>`;
  document.body.appendChild(m);
  $('#up-img').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { const img = new Image(); img.onload = () => {
      const max = 220, sc = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      let url; try { url = cv.toDataURL('image/webp', .85); if (!url.startsWith('data:image/webp')) url = cv.toDataURL('image/png'); } catch (err) { url = rd.result; }
      setIcon(url);
    }; img.src = rd.result; };
    rd.readAsDataURL(f);
  });
}
function setIcon(k) { if (CUSTOM[pickIdx]) { CUSTOM[pickIdx].i = k; delete CUSTOM[pickIdx].sample; saveCustom(); } closeModal(); render(); }
function closeModal() { const m = $('#iconmodal'); if (m) m.remove(); }

/* ===== 이벤트 ===== */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'SELECT') return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a !== 'clearall' && a !== 'quit') confirmKey = null;
  switch (a) {
    case 'source': S.source = v; save(); render(); break;
    case 'grade': {
      const g = +v; const has = S.grades.includes(g);
      if (has && S.grades.length === 1) break;
      S.grades = has ? S.grades.filter(x => x !== g) : [...S.grades, g];
      const info = GRADE_INFO[Math.min(...S.grades)]; S.mode = info.mode; S.pattern = info.pattern;
      save(); render(); break;
    }
    case 'word': { const id = b.dataset.id; S.off = S.off.includes(id) ? S.off.filter(x => x !== id) : [...S.off, id]; save(); render(); break; }
    case 'allon': { const ids = S.grades.flatMap(g => BANK[g].map(it => it.id)); S.off = S.off.filter(x => !ids.includes(x)); save(); render(); break; }
    case 'alloff': { const ids = S.grades.flatMap(g => BANK[g].map(it => it.id)); S.off = [...new Set([...S.off, ...ids])]; save(); render(); break; }
    case 'tocustom': {
      const add = pool().map(it => ({ id: uid(), w: it.w, ko: it.ko, i: it.i, c: it.c.slice(), ...(it.art ? { art: it.art } : {}), ...(it.pl ? { pl: it.pl } : {}) }));
      CUSTOM = [...CUSTOM.filter(it => !it.sample && (it.w || '').trim()), ...add]; saveCustom(); S.source = 'custom'; save(); render(); break;
    }
    case 'game': S.game = v; save(); render(); break;
    case 'mode': S.mode = v; save(); render(); break;
    case 'opt': S[b.dataset.k] = !S[b.dataset.k]; save(); render(); break;
    case 'addrow': CUSTOM.push({ id: uid(), w: '', ko: '', i: 'question', c: ['', '', ''] }); saveCustom(); render(); setTimeout(() => { const ins = document.querySelectorAll('.erow input[data-f="w"]'); ins[ins.length - 1]?.focus(); }, 0); break;
    case 'delrow': CUSTOM.splice(+b.dataset.idx, 1); saveCustom(); render(); break;
    case 'clearall': if (confirmKey === 'clear') { CUSTOM = []; confirmKey = null; saveCustom(); } else confirmKey = 'clear'; render(); break;
    case 'resetsample': CUSTOM = [...SAMPLE_CUSTOM(), ...CUSTOM.filter(it => !it.sample)]; saveCustom(); render(); break;
    case 'pickicon': openIcons(+b.dataset.idx); break;
    case 'seticon': setIcon(b.dataset.k); break;
    case 'closemodal': closeModal(); break;
    case 'mute': muted = !muted; store.set('hw-muted', muted); render(); break;
    case 'start': startGame(); break;
    case 'fs': try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.().catch(() => {}); } catch (err) {} break;
    case 'quit': if (confirmKey === 'quit') { confirmKey = null; go('setup'); } else { confirmKey = 'quit'; render(); } break;
    case 'quit2': $('#ov')?.remove(); G = null; go('setup'); break;
    case 'hint': doHint(); break;
    case 'reveal': doReveal(); break;
    case 'next': doNext(); break;
    case 'draw': doDraw(); break;
    case 'say': speak(b.dataset.t); break;
    case 'award': award(+b.dataset.n); break;
    case 'minus': award(+b.dataset.n, -1); break;
    case 'bingoN': S.bingoN = +v; save(); render(); break;
    case 'bstart': go('bingo'); break;
    case 'bingo': showBingo(); break;
    case 'closeov': $('#ov')?.remove(); break;
    case 'again': startGame(); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target; const a = t.dataset.act;
  if (a === 'pattern') { S.pattern = t.value; save(); }
  else if (a === 'teams') { S.teams = +t.value; save(); render(); }
  else if (a === 'timer') { S.timer = +t.value; save(); }
});
document.addEventListener('input', e => {
  const t = e.target; const f = t.dataset.f; if (!f) return;
  const row = t.closest('.erow'); if (!row) return;
  const it = CUSTOM[+row.dataset.idx]; if (!it) return;
  if (f.startsWith('c')) { it.c = it.c || ['', '', '']; it.c[+f.slice(1)] = t.value; } else it[f] = t.value;
  delete it.sample; delete it.pl; delete it.art;
  saveCustom();
  const cnt = $('.step .count'); if (cnt) cnt.textContent = pool().length;
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); $('#ov')?.remove(); }
  if (!(screen === 'quiz' || screen === 'bingo') || !G) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || $('#ov')) return;
  const k = e.key.toLowerCase();
  if (k === ' ' || k === 'arrowright' || k === 'enter') { if (k !== 'enter' || e.target === document.body) { e.preventDefault(); advance(); } }
  else if (k === 'r') doReveal();
  else if (k === 'h') doHint();
  else if (k === 's') { const btn = document.querySelector('.controls [data-act="say"]'); if (btn) speak(btn.dataset.t); }
  else if (/^[1-6]$/.test(k) && G.kind === 'quiz' && +k <= S.teams) award(+k - 1);
});

/* ===== 사탕 비 (축하 효과) ===== */
function rain() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('#fx'); cv.hidden = false; const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const imgs = ['candy', 'lollipop', 'pumpkin', 'ghost', 'bat', 'star', 'chocolate'].map(k => { const im = new Image(); im.src = ico(k); return im; });
  const ps = Array.from({ length: 70 }, () => ({ x: Math.random() * innerWidth, y: -40 - Math.random() * innerHeight * .8, s: 26 + Math.random() * 30, vy: 2.2 + Math.random() * 3, vx: -1 + Math.random() * 2, r: Math.random() * 6, vr: -.06 + Math.random() * .12, im: imgs[Math.random() * imgs.length | 0] }));
  const t0 = performance.now();
  (function f(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => { p.y += p.vy; p.x += p.vx; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.drawImage(p.im, -p.s / 2, -p.s / 2, p.s, p.s); ctx.restore(); });
    if (t - t0 < 4200) requestAnimationFrame(f); else { ctx.clearRect(0, 0, innerWidth, innerHeight); cv.hidden = true; }
  })(t0);
}

/* ===== 시작 (+ 열린 화면 상태 보존) ===== */
function start(data) {
  if (data && data.G && data.screen) { G = data.G; screen = data.screen; }
  render();
  if (G && (screen === 'quiz' || screen === 'bingo')) startTimer();
}
window.claude?.hot?.snapshot?.(() => ({ G, screen }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
try { window.speechSynthesis && speechSynthesis.getVoices(); } catch (e) {}
</script>

</body>
</html>
